<svg viewBox="0 0 1010 150" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Time range labels above each segment -->
  <text x="2" y="28" text-anchor="start" font-size="12" fill="#52525b">9:00–9:15</text>
  <text x="230" y="28" text-anchor="middle" font-size="12" fill="#52525b">9:15–11:30</text>
  <text x="542" y="28" text-anchor="middle" font-size="12" fill="#52525b">11:30–13:00</text>
  <text x="792" y="28" text-anchor="middle" font-size="12" fill="#52525b">13:00–14:30</text>
  <text x="938" y="28" text-anchor="middle" font-size="12" fill="#52525b">14:30–14:45</text>
  <text x="980" y="52" text-anchor="middle" font-size="12" fill="#52525b">14:45–15:00</text>

  <!-- Leader ticks for the narrow auction segments -->
  <line x1="21" y1="34" x2="21" y2="46" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="938" y1="34" x2="938" y2="46" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="980" y1="58" x2="980" y2="46" stroke="#a1a1aa" stroke-width="1"/>

  <!-- Timeline bar -->
  <g>
    <rect x="0" y="70" width="42" height="46" fill="#f59e0b"/>
    <rect x="42" y="70" width="375" height="46" fill="#059669"/>
    <rect x="417" y="70" width="250" height="46" fill="#d4d4d8"/>
    <rect x="667" y="70" width="250" height="46" fill="#059669"/>
    <rect x="917" y="70" width="42" height="46" fill="#f59e0b"/>
    <rect x="959" y="70" width="42" height="46" fill="#0ea5e9"/>
  </g>

  <!-- Segment separators -->
  <g stroke="#ffffff" stroke-width="2">
    <line x1="42" y1="70" x2="42" y2="116"/>
    <line x1="417" y1="70" x2="417" y2="116"/>
    <line x1="667" y1="70" x2="667" y2="116"/>
    <line x1="917" y1="70" x2="917" y2="116"/>
    <line x1="959" y1="70" x2="959" y2="116"/>
  </g>

  <!-- Type labels inside bar -->
  <text x="21" y="97" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">ATO</text>
  <text x="230" y="97" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">LO · MP</text>
  <text x="542" y="97" text-anchor="middle" font-size="13" fill="#52525b" font-weight="700">Nghỉ trưa</text>
  <text x="792" y="97" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">LO · MP</text>
  <text x="938" y="97" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">ATC</text>
  <text x="980" y="100" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">Thỏa</text>
  <text x="980" y="111" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">thuận</text>

  <!-- Legend -->
  <g font-size="12" fill="#3f3f46">
    <rect x="0" y="132" width="14" height="14" fill="#f59e0b"/>
    <text x="20" y="143">Khớp lệnh định kỳ (ATO/ATC)</text>

    <rect x="270" y="132" width="14" height="14" fill="#059669"/>
    <text x="290" y="143">Khớp lệnh liên tục (LO, MP)</text>

    <rect x="540" y="132" width="14" height="14" fill="#d4d4d8"/>
    <text x="560" y="143">Tạm nghỉ, không khớp lệnh</text>

    <rect x="800" y="132" width="14" height="14" fill="#0ea5e9"/>
    <text x="820" y="143">Giao dịch thỏa thuận</text>
  </g>
</svg>
